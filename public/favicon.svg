<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded square for clear visibility on dark & light browser tabs -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" />
  
  <!-- Ground base -->
  <path d="M10 52 L44 52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Main Dispenser Body -->
  <path d="M13 50 L13 18 C13 15.8 14.8 14 17 14 L37 14 C39.2 14 41 15.8 41 18 L41 50 Z" fill="#ffffff" />

  <!-- Canopy roof band -->
  <path d="M11 18 L43 18" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

  <!-- Digital Display Panel -->
  <rect x="18" y="22" width="18" height="11" rx="2.5" fill="#0f172a" />
  <rect x="21" y="25" width="12" height="2" rx="1" fill="#10b981" />
  <rect x="21" y="28.5" width="7" height="2" rx="1" fill="#34d399" />

  <!-- Dispenser lower lines -->
  <line x1="20" y1="39" x2="34" y2="39" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="43" x2="34" y2="43" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Fuel Hose & Nozzle in Golden Yellow -->
  <path d="M41 24 C48 24 51 29 51 38 L51 43 C51 46 48 48 45 48 C43 48 41 46 41 43" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M51 32 L51 22 L46 17" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="46" cy="17" r="2" fill="#fbbf24" />
</svg>
